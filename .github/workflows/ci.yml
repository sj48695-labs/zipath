name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: Lint / Build / Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zipath
          POSTGRES_PASSWORD: zipath
          POSTGRES_DB: zipath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://zipath:zipath@localhost:5432/zipath_test
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      PORT: 3001
      DATA_GO_KR_API_KEY: ci-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: npm ci

      - name: Lint
        run: npx turbo lint

      - name: Build
        run: npx turbo build

      - name: Unit tests
        run: npm test -w @zipath/api

      - name: E2E tests
        run: npm run test:e2e -w @zipath/api

  # template: playwright-e2e v0.1
  # PR: Vercel preview URL (현재 PR 의 코드) 가 deploy 되길 기다린 뒤 그곳에 e2e.
  # workflow_dispatch: 명시한 base URL 또는 default 운영 dev URL.
  e2e-web:
    name: E2E (web)
    needs: ci
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e-web'))
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # PR 이면 Vercel preview URL 을 기다린다. develop/main 의 마지막 배포본 대신 PR 코드 자체를 검증.
      - name: Wait for Vercel preview
        if: github.event_name == 'pull_request'
        id: vercel-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 10

      # workflow_dispatch 또는 preview URL 없을 때는 develop 의 deployed dev URL fallback.
      - name: Resolve base URL
        id: base-url
        run: |
          if [ -n "${{ steps.vercel-preview.outputs.url }}" ]; then
            echo "url=${{ steps.vercel-preview.outputs.url }}" >> "$GITHUB_OUTPUT"
            echo "Using Vercel preview URL: ${{ steps.vercel-preview.outputs.url }}"
          else
            echo "url=https://zipath-web.vercel.app" >> "$GITHUB_OUTPUT"
            echo "Using fallback dev URL: https://zipath-web.vercel.app"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web-e2e

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web-e2e

      - name: Run Playwright
        env:
          ZIPATH_BASE_URL: ${{ steps.base-url.outputs.url }}
        run: npx playwright test
        working-directory: apps/web-e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report/
          retention-days: 7

  deploy-render:
    name: Deploy to Render
    needs: ci
    runs-on: ubuntu-latest
    # develop push일 때만 실행 (PR 이벤트 제외)
    # 사전 조건: Render 서비스의 Auto-Deploy를 Off로 설정해야 함
    #   Render Dashboard → 서비스 선택 → Settings → Auto-Deploy → Disabled
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL "${{ secrets.RENDER_DEPLOY_HOOK }}"

  auto-merge:
    name: Auto Merge
    needs: ci
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')

    steps:
      - name: Merge PR
        run: gh pr merge "${{ github.event.number }}" --squash --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
